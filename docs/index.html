<!doctype html>
<html lang="pt-BR" data-ecoplant-version="1.1.0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173e32">
  <meta name="description" content="Seu jardim, em um só lugar. Registre plantas, observe as folhas e acompanhe sua evolução com o Ecoplant.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ecoplant">
  <script>
    try {
      const saved = localStorage.getItem('ecoplant-theme');
      const theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101b15' : '#173e32';
    } catch (_) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/ecoplant-apple-touch-180.png">
  <link rel="icon" href="./assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="./assets/favicon-64.png" type="image/png" sizes="64x64">
  <link rel="shortcut icon" href="./assets/favicon.ico">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./theme.css">
  <link rel="stylesheet" href="./experience.css">
  <title>Ecoplant — Seu jardim, em um só lugar</title>
</head>
<body>
  <section id="eco-splash" class="eco-splash" role="status" aria-label="Ecoplant iniciando" aria-live="polite">
    <div class="eco-splash-content">
      <div class="eco-plant-wrap" aria-hidden="true"><div class="eco-plant-base"><div class="eco-flowerpot"></div><div class="eco-blade eco-blade-center"></div><div class="eco-blade eco-blade-left-s"></div><div class="eco-blade eco-blade-right-s"></div><div class="eco-blade eco-blade-left-l"></div><div class="eco-blade eco-blade-right-l"></div></div></div>
      <h1 class="eco-splash-logo"><img class="eco-splash-logo-image" src="./assets/ecoplant-logo.png" width="64" height="64" alt="">Ecoplant<span aria-hidden="true">.</span></h1>
      <p class="eco-splash-tagline">Cada folha, uma história.</p>
      <p class="eco-splash-progress">Preparando seu jardim…</p><div id="eco-boot-error" class="eco-splash-recovery" hidden><p>Não foi possível concluir a abertura. Confira sua conexão e tente novamente.</p><button type="button" onclick="location.reload()" class="eco-experience-retry">Tentar novamente</button></div>
    </div>
  </section>
  <div id="app"><div class="boot"><span class="sprout-mark">❧</span><h1>Ecoplant</h1><p>Preparando seu jardim…</p><span class="spinner"></span></div></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Ative o JavaScript para abrir o Ecoplant.</noscript>
  <script>setTimeout(function(){if(!document.documentElement.hasAttribute("data-ecoplant-started")){var message=document.getElementById("eco-boot-error");if(message)message.hidden=false;}},9000);</script>
  <script type="module" src="./app.js"></script>
</body>
</html>
